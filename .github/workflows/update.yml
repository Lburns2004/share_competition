name: Update share tracker

on:
  schedule:
    # Every 5 min, Mon-Fri, 07:00-22:55 UTC. Covers Paris open (08:00 UK) to the 21:30 UK
    # scoring run in both GMT and BST. The script makes NO requests when markets are shut.
    - cron: '*/5 7-22 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a full rebuild (history + points backfill)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: share-tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      deploy: ${{ steps.run.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      # Yahoo returns HTTP 429 to plain Python clients. curl_cffi sends a real Chrome fingerprint.
      - name: Install browser-impersonating HTTP client
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check curl_cffi \
            || echo "::warning::curl_cffi install failed - falling back to plain urllib (Yahoo may block it)"

      - name: Fetch prices, score the day, build site
        id: run
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
          # Manual runs fail RED with the real error; scheduled runs stay quiet and retry in 5 min.
          SOFT_FAIL: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
          # Optional: set a repo variable called YAHOO_HOSTS to route via your own proxy.
          YAHOO_HOSTS: ${{ vars.YAHOO_HOSTS }}
        run: .venv/bin/python scripts/update.py
