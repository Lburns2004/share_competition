name: Update share tracker

on:
  schedule:
    # Every 5 min, Mon-Fri, 07:00-22:55 UTC. Covers Paris open (08:00 UK) to the 21:30 UK
    # scoring run in both GMT and BST. The script decides if anything actually needs doing.
    - cron: '*/5 7-22 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a full rebuild (history + points backfill)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: share-tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      deploy: ${{ steps.run.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices, score the day, build site
        id: run
        env:
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: python3 scripts/update.py

      - name: Save leaderboard + history back to the repo
        if: steps.run.outputs.committed == 'true'
        run: |
          git config user.name  "share-tracker-bot"
          git config user.email "share-tracker-bot@users.noreply.github.com"
          git add data/leaderboard.json data/history.json
          git commit -m "Update leaderboard $(date -u +%F)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Upload site
        if: steps.run.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
